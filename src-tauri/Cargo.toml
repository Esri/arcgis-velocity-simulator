[package]
name = "velocity-desktop"
version = "1.1.0"
edition = "2021"
description = "Native desktop host for ArcGIS Velocity desktop applications"
license = "Apache-2.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "time"] }
rfd = "0.15"
arboard = "3"
open = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Console"] }
